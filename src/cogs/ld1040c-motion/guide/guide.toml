# Sensor guide for ld1040c-motion (WeftOS ADR-104 sensor-guide format, schema 1).
# Pages are Markdown files next to this one (guide/<page>.md).

schema = 1
title = "HLK-LD1040C 10.525 GHz Motion Radar on a Cognitum Seed"
sensor = "Hi-Link HLK-LD1040C 10.525 GHz X-band Doppler motion/occupancy radar"
cog = "ld1040c-motion"
cog_version = "0.1.0"
medical = false
pages = ["start", "sensor", "wiring", "connect", "telemetry", "troubleshoot", "api"]

# Checklist step ids the companion app links to a page.
[links]
seed_api = "connect"
cog_installed = "connect"
cog_running = "connect"
export = "connect"
gpio = "wiring"
uart = "telemetry"
warmup = "start"
present = "troubleshoot"

# The Seed's 40-pin header: pins this sensor uses, and pins to stay away from.
[header]
board = "Raspberry Pi Zero 2 W / Pi 5 (Cognitum Seed)"
orientation = "Hold it with the 40-pin header along the TOP edge and the ports along the BOTTOM, micro-SD at the left. Pin 1 (3.3 V) is the LEFT pin of the INNER row (nearer the chip); the OUTER row (nearer the top edge) is the even pins 2-40."
use = [
  { pin = 2, name = "5V", to = "module VCC (5 V)", color = "red" },
  { pin = 6, name = "GND", to = "module GND", color = "black" },
  { pin = 11, name = "GPIO17", to = "module OUT (motion)", color = "green" },
  { pin = 8, name = "GPIO14 TXD", to = "module RX (optional UART)", color = "yellow" },
  { pin = 10, name = "GPIO15 RXD", to = "module TX (optional UART)", color = "blue" },
]
avoid = [
  { pin = 1, why = "3.3 V: the LD1040C wants 5 V on VCC" },
  { pin = 4, why = "5 V, but keep it for the module only if you are not powering anything else there" },
]

[[parts]]
id = "module"
name = "HLK-LD1040C"
detail = "10.525 GHz motion radar"
pins = ["VCC", "GND", "OUT", "TX", "RX"]

[[parts]]
id = "seed"
name = "Seed header"
detail = "Pi GPIO + UART"
pins = ["2 5V", "6 GND", "11 GPIO17", "8 TXD", "10 RXD"]

[[wires]]
from = "module.VCC"
to = "seed.2 5V"
color = "red"
label = "5 V"

[[wires]]
from = "module.GND"
to = "seed.6 GND"
color = "black"
label = "GND"

[[wires]]
from = "module.OUT"
to = "seed.11 GPIO17"
color = "green"
label = "motion (3.3 V TTL)"

[[wires]]
from = "module.TX"
to = "seed.10 RXD"
color = "blue"
label = "UART data (optional)"

[[wires]]
from = "module.RX"
to = "seed.8 TXD"
color = "yellow"
label = "UART (optional)"

# Signal flow, left to right.
[[flow]]
name = "Radar"
detail = "10.525 GHz Doppler"

[[flow]]
name = "OUT pin"
detail = "HIGH on motion, 5 s hold"

[[flow]]
name = "Pi GPIO17"
detail = "sampled ~100 Hz"

[[flow]]
name = "ld1040c cog"
detail = "edges + active fraction"

[[flow]]
name = "Outputs"
detail = "present + motion_events"
